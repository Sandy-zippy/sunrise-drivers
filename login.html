<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Staff Portal — Sunrise Drivers</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    :root{ --bg:#09090B; --amber:#F59E0B; --gray2:#52525B; }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;background:var(--bg);overflow:hidden;}
    /* Loading splash shown until the portal iframe finishes loading */
    #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:2;transition:opacity .4s;}
    #loader img{height:40px;margin-bottom:22px;}
    .spinner{width:34px;height:34px;border:3px solid rgba(245,158,11,.2);border-top-color:var(--amber);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #loader p{margin-top:18px;color:var(--gray2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13px;}
    /* The portal, embedded so Google's app bar never shows and the URL stays on our domain */
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;}
  </style>
</head>
<body>
  <div id="loader">
    <img src="assets/logo.png" alt="Sunrise Drivers">
    <div class="spinner"></div>
    <p>Loading the staff portal…</p>
  </div>
  <iframe
    id="portal"
    title="Sunrise Drivers Staff Portal"
    src="https://script.google.com/macros/s/AKfycbxrvooGslCcUBOAQHoa_GPfGVIpc1BdMm0eEFLSQ3yZa_z2wLsqwUXT7ZkLxeuWMFDUwg/exec"
    allow="clipboard-read; clipboard-write"></iframe>
  <script>
    var f = document.getElementById('portal');
    var loader = document.getElementById('loader');
    f.addEventListener('load', function(){
      loader.style.opacity = '0';
      setTimeout(function(){ loader.style.display = 'none'; }, 400);
    });
    // Safety: hide the loader after 6s even if the load event is swallowed
    setTimeout(function(){ loader.style.opacity='0'; setTimeout(function(){loader.style.display='none';},400); }, 6000);
  </script>
</body>
</html>
