<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to secure payment…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8e6e1}
  .box{text-align:center;padding:32px}
  .spin{width:34px;height:34px;border:3px solid #2a2d34;border-top-color:#E8730C;border-radius:50%;
        margin:0 auto 18px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#E8730C}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>Taking you to your secure Razorpay payment…</div>
    <div id="fallback" style="margin-top:14px;font-size:14px;color:#9a978f"></div>
  </div>
  <script>
    (function () {
      var c = new URLSearchParams(location.search).get('c') || '';
      if (/^[A-Za-z0-9_-]{4,40}$/.test(c)) {
        var url = 'https://rzp.io/rzp/' + c;
        document.getElementById('fallback').innerHTML =
          'Not redirected? <a href="' + url + '">Tap here to pay</a>.';
        location.replace(url);
      } else {
        document.querySelector('.box').innerHTML =
          'This payment link is invalid or has expired. Please contact Sunrise Drivers.';
      }
    })();
  </script>
</body>
</html>
