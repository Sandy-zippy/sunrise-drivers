<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunrise Drivers — How Our System Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14202E; --ink2:#41556B; --ink3:#7A8DA1;
  --canvas:#E7ECF2; --paper:#FFFFFF; --line:#C9D5E1;
  --sun1:#FDD806; --sun2:#EE8C00; --sunDeep:#B45500; --sunSoft:#FFF3DA;
  --auto:#0E7C6B; --autoSoft:#DFF2EE;
  --zs:#D5EB4B;
  --shadow:0 1px 2px rgba(20,32,46,.08), 0 8px 24px rgba(20,32,46,.08);
  --shadow-lg:0 2px 4px rgba(20,32,46,.10), 0 18px 48px rgba(20,32,46,.16);
  --display:"Bricolage Grotesque","Archivo",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--body);color:var(--ink);background:var(--canvas);
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--paper);
  border-bottom:1px solid var(--line);position:relative;z-index:40;flex-wrap:wrap;
}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;
  background:linear-gradient(90deg,var(--sun1),var(--sun2) 55%,var(--sunDeep));}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:38px;width:auto;display:block}
.brand .txt{line-height:1.05}
.brand .n{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand .sub{font-size:11px;color:var(--ink3);letter-spacing:.10em;text-transform:uppercase;font-weight:600}

.views{display:flex;gap:4px;background:var(--canvas);padding:4px;border-radius:12px;margin-left:6px}
.views button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.views button[aria-selected="true"]{background:var(--ink);color:#fff}

.spacer{flex:1}
.powered{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
.powered span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.powered img{height:17px;width:auto;display:block}

/* ---------- map view ---------- */
.stage{position:relative;flex:1;overflow:hidden;isolation:isolate}
.stage::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(900px 420px at 18% 42%, rgba(253,216,6,.30), transparent 62%),
    radial-gradient(1100px 520px at 8% 46%, rgba(238,140,0,.20), transparent 60%),
    linear-gradient(180deg,#EDF1F6,#DFE6EE);
  z-index:0;
}
.grid{position:absolute;inset:0;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(20,32,46,.13) 1px, transparent 1px);background-size:26px 26px}
.viewport{position:absolute;inset:0;z-index:1;cursor:grab;touch-action:none}
.viewport.drag{cursor:grabbing}
.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

/* ---------- node cards ---------- */
.node{
  position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px 12px 15px;box-shadow:var(--shadow);text-align:left;
  transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  border-left:5px solid var(--ink3);
}
.node:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.node:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.node.you{border-left-color:var(--sun2)}
.node.auto{border-left-color:var(--auto)}
.node.info{border-left-color:var(--ink2)}
.node.sel{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,32,46,.14),var(--shadow-lg)}
.node.dim{opacity:.28}
.node.hit{border-color:var(--sun2);box-shadow:0 0 0 3px rgba(238,140,0,.30),var(--shadow)}
.node .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:3px}
.node .ttl{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.node .sml{font-size:12.5px;line-height:1.42;color:var(--ink2);margin-top:5px}
.node .chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip.you{background:var(--sunSoft);color:var(--sunDeep)}
.chip.auto{background:var(--autoSoft);color:var(--auto)}
.chip.info{background:#E7ECF2;color:var(--ink2)}

/* root node */
.node.root{
  border:0;border-left:0;padding:18px 22px;background:linear-gradient(135deg,#1B2A3B,#14202E 60%);
  color:#fff;box-shadow:0 20px 50px rgba(20,32,46,.34);border-radius:20px;
}
.node.root::after{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;
  background:linear-gradient(135deg,var(--sun1),var(--sun2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.node.root .ttl{font-size:22px;color:#fff;letter-spacing:-.02em}
.node.root .sml{color:#C7D6E4;font-size:13px}
.node.root .eyebrow{color:var(--sun1)}

/* expand toggle */
.tog{
  position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--mono);
  font-size:13px;font-weight:600;color:var(--ink2);box-shadow:0 2px 6px rgba(20,32,46,.14);z-index:3;line-height:1;
}
.tog:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog .cnt{position:absolute;top:-8px;right:-8px;background:var(--sun2);color:#fff;font-size:9px;
  border-radius:999px;padding:1px 4px;font-weight:700}

/* ---------- toolbar ---------- */
.tools{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .grp{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.tools .grp button{border:0;background:transparent;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tools .grp button+button{border-left:1px solid var(--line)}
.tools .grp button:hover{background:var(--canvas);color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px 12px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;font:inherit;font-size:13px;width:170px;background:transparent}
.search .n{font-family:var(--mono);font-size:11px;color:var(--ink3)}

.legend{position:absolute;right:14px;bottom:14px;z-index:20;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-size:12px;display:flex;gap:16px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .you i{background:var(--sun2)} .legend .auto i{background:var(--auto)}
.legend b{font-family:var(--mono);font-size:11px}

/* ---------- detail drawer ---------- */
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:392px;background:var(--paper);border-left:1px solid var(--line);
  z-index:30;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:-18px 0 44px rgba(20,32,46,.14)
}
.drawer.open{transform:none}
.drawer header{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
.drawer header .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.drawer h2{font-family:var(--display);font-size:22px;margin:6px 0 0;letter-spacing:-.02em;line-height:1.15;padding-right:34px}
.drawer .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1;color:var(--ink2)}
.drawer .close:hover{background:var(--ink);color:#fff}
.dbody{overflow:auto;padding:20px 22px 34px;flex:1}
.dsec{margin-bottom:20px}
.dsec h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px;font-family:var(--mono);font-weight:600}
.dsec p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.dsec ol,.dsec ul{margin:0;padding-left:20px;font-size:14px;line-height:1.62}
.dsec li{margin-bottom:7px}
.plainbox{background:linear-gradient(135deg,var(--sunSoft),#FFFBF0);border:1px solid #F4DFB0;border-radius:12px;padding:14px 16px}
.plainbox p{font-size:15px;line-height:1.55}
.watch{background:#FFF6F4;border:1px solid #F6D4CB;border-radius:12px;padding:13px 15px}
.watch p{font-size:14px;line-height:1.55;color:#8A3418}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{font-family:var(--mono);font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding-top:3px}
.kv dd{margin:0}
code,.mono{font-family:var(--mono);font-size:12.5px;background:#EEF2F7;border:1px solid #DCE4EC;border-radius:5px;padding:1px 5px}
.jump{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.jump button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;text-align:left}
.jump button:hover{border-color:var(--ink);background:var(--canvas)}

/* ---------- walkthrough & sheet views ---------- */
.pane{position:absolute;inset:0;overflow:auto;z-index:2;background:var(--canvas);display:none}
.pane.on{display:block}
.wrap{max-width:1080px;margin:0 auto;padding:34px 26px 90px}
.panehead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.panehead img{height:44px;width:auto}
.panehead .bl{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.1}
.panehead .bs{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sunDeep);font-weight:600}
h1.big{font-family:var(--display);font-size:clamp(30px,4.6vw,46px);line-height:1.02;letter-spacing:-.035em;margin:10px 0 12px;max-width:20ch}
.lede{font-size:17px;line-height:1.6;color:var(--ink2);max-width:64ch;margin:0 0 30px}

.step{display:grid;grid-template-columns:74px 1fr;gap:22px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.step::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ink3)}
.step.you::before{background:var(--sun2)} .step.auto::before{background:var(--auto)}
.step .num{font-family:var(--display);font-size:44px;font-weight:800;line-height:.9;color:var(--canvas);
  -webkit-text-stroke:1.5px var(--ink3);letter-spacing:-.05em}
.step.you .num{-webkit-text-stroke-color:var(--sun2);color:var(--sunSoft)}
.step.auto .num{-webkit-text-stroke-color:var(--auto);color:var(--autoSoft)}
.step h3{font-family:var(--display);font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
.step .say{font-size:15px;color:var(--ink2);line-height:1.55;margin:0 0 14px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.cols{grid-template-columns:1fr}.step{grid-template-columns:1fr;gap:10px}}
.cols h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:0 0 7px;font-weight:600}
.cols ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.cols li{margin-bottom:6px}
.msg{margin-top:14px;background:#F0F7F5;border:1px solid #CBE5DE;border-radius:12px;padding:11px 14px;font-size:13.5px;color:#0B5F52}
.msg b{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:30px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h4{font-family:var(--display);font-size:16px;margin:0 0 6px;letter-spacing:-.01em}
.card p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.card .tagx{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sunDeep);font-weight:600;display:block;margin-bottom:7px}
.card.dark{background:linear-gradient(135deg,#1B2A3B,#14202E);color:#fff;border:0}
.card.dark h4{color:#fff} .card.dark p{color:#C7D6E4} .card.dark .tagx{color:var(--sun1)}

.rule{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:11px}
.rule .mark{font-family:var(--display);font-weight:800;font-size:16px;color:#fff;background:var(--ink);width:28px;height:28px;
  border-radius:8px;display:grid;place-items:center;flex:none}
.rule.no .mark{background:#B4341A} .rule.yes .mark{background:var(--auto)}
.rule p{margin:0;font-size:14.5px;line-height:1.55}
.rule b{display:block;font-family:var(--display);font-size:15.5px;margin-bottom:3px}

.hr{height:1px;background:var(--line);margin:34px 0 26px;border:0}
h2.sec{font-family:var(--display);font-size:26px;letter-spacing:-.025em;margin:0 0 6px}
p.secsub{font-size:15px;color:var(--ink2);margin:0 0 20px;max-width:60ch}

.footnote{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:12px;font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.footnote img{height:16px;opacity:.85}

@media(max-width:900px){
  .drawer{width:100%;top:auto;height:72%;transform:translateY(102%);border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0}
  .drawer.open{transform:none}
  .legend{display:none}
  .search input{width:110px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{overflow:visible;background:#fff}
  .bar,.tools,.legend,.drawer,.views{display:none!important}
  .pane{position:static;display:block!important;overflow:visible}
  .step,.card,.rule{break-inside:avoid}
}
</style>
</head>

<script>
/* ============================================================
   1. THE CONTENT  (everything the team needs to know)
   ============================================================ */
const YOU='you', AUTO='auto', INFO='info';

const TREE = {
  id:'root', a:INFO, eye:'Sunrise Drivers · Operating system',
  t:'How the whole thing works',
  s:'A client asks for a driver, pays, gets a driver, and then keeps getting WhatsApp updates — mostly on its own.',
  d:{
    plain:'Think of it as one long conveyor belt. A client steps on at "New Lead" and comes off at "Client". The belt moves by itself. Your team only touches it six times.',
    how:['The CRM (GoHighLevel, we call it GHL) holds every client and moves them through stages.','Every time a client changes stage, a WhatsApp message goes out automatically.','Money is handled by Razorpay. Attendance comes from PagarBook.','A small robot checks everything every 5 minutes and fixes the paperwork.'],
    you:'Click any bubble on the map to learn that part. Start with "The 6 things you actually do".'
  },
  c:[
    /* ---------- 1. START HERE ---------- */
    {id:'start', a:INFO, eye:'Start here', t:'The 30-second version', s:'If you read nothing else, read these three.',
     d:{plain:'Three facts explain 90% of this system.',
        how:['A client moves through 8 stages. The stage IS the truth — nothing else.','Almost every message is sent by the system, not by a person.','Your team has exactly 6 manual jobs. Everything else runs itself.']},
     c:[
      {id:'s1', a:INFO, t:'The stage is the truth', s:'Wherever the client card sits in the pipeline, that IS their status.',
       d:{plain:'In GHL every client has a card (we call it an opportunity). That card sits in one column of the pipeline. That column is the client\'s real status.',
          how:['If the card is in "Driver Matching", the client is waiting for a driver. Full stop.','Do not keep a separate list, notebook or WhatsApp note. The card is the record.','Moving a card is a real action — it makes messages fire.'],
          watch:'Never drag a card just to "tidy up". Dragging is how the system is told something happened.'}},
      {id:'s2', a:AUTO, t:'The system sends the messages', s:'You almost never type a WhatsApp update to a client.',
       d:{plain:'Every client-facing WhatsApp — welcome, payment link, driver details, attendance report, receipt — is sent automatically by GHL.',
          how:['Each stage has a message attached to it.','The message picks up the client name, driver name, numbers, etc. by itself.','You still call clients like normal. This only covers the standard updates.']}},
      {id:'s3', a:YOU, t:'You only do 6 things', s:'Call, qualify, enter the driver, start service, upload attendance, watch for problems.',
       d:{plain:'The full list of manual work in this system is six items long.',
          how:['1. Move a new lead to Contacted after you call them.','2. Move them to Qualified once they are serious.','3. Enter the driver details at Driver Matching (the only real typing job).','4. Move the card to Client when service starts.','5. Upload the PagarBook attendance file in the portal each period.','6. Notice when something looks wrong and tell the admin.'],
          you:'That is it. If you find yourself doing anything else by hand, ask first — the system probably already does it.'}}
     ]},

    /* ---------- 2. THE TOOLS ---------- */
    {id:'tools', a:INFO, eye:'The parts', t:'The 7 tools (and what each one is for)', s:'Seven boxes. Each has one job. You only ever touch two of them.',
     d:{plain:'Seven pieces of software make this work. Only two are yours to open: the CRM and the attendance portal.',
        how:['You use: GHL (the CRM) and the Attendance Portal.','You export from: PagarBook.','You never open: the ID Sheet, the reconciler, the tag-cleaner, Razorpay.']},
     c:[
      {id:'t-ghl', a:INFO, eye:'Tool 1', t:'GHL — the brain', s:'The CRM. Holds every client, every stage, every message.',
       d:{plain:'GoHighLevel (GHL) is the CRM. It is where the whole business lives — clients, their stage, their driver, and every WhatsApp that goes out.',
          how:['A Contact = the person. Their name and phone number.','An Opportunity = their deal card, sitting in one stage of the pipeline.','A Workflow = a small automatic recipe: "when X happens, do Y".','A Tag = a sticker on the contact so the system knows which message to send.'],
          you:'This is your main screen. If you are unsure where a client stands, open GHL and look at which column their card is in.'}},
      {id:'t-rzp', a:AUTO, eye:'Tool 2', t:'Razorpay — the money', s:'Makes payment links, runs the monthly AutoPay, and tells GHL when money lands.',
       d:{plain:'Razorpay collects the money. It creates the payment link for the joining fee and runs the monthly auto-debit for Care Plan clients.',
          how:['When you mark a lead Qualified, Razorpay is asked to build the payment link automatically.','The moment the client pays, Razorpay tells GHL and the card moves to Payment Confirmed by itself.','For Care Plan, Razorpay also sends the AutoPay approval link and charges every month.'],
          watch:'Never create a payment link by hand. A hand-made link is invisible to the system, so nothing after it will fire.'}},
      {id:'t-sheet', a:INFO, eye:'Tool 3', t:'The ID Sheet — the backup notebook', s:'A Google Sheet that quietly keeps a copy of every driver and who they are placed with.',
       d:{plain:'"Sunrise CRM Master" is a Google Sheet with two tabs: drivers and clients. It is a backup copy and a lookup table — not a workspace.',
          how:['drivers_v1 = every driver, their phone, experience, languages, and which client they are with.','clients_v1 = every client and their customer ID.','The system fills this sheet in by itself, from GHL.'],
          watch:'Do not type in this sheet. Ever. If you change it by hand you break the link between a driver and their attendance report.'}},

/* ============================================================
   2. BUILD THE MAP
   ============================================================ */
const NODES = new Map();
(function index(n, depth, parent){
  n.depth = depth; n.parent = parent||null;
  n.open = depth === 0;
  NODES.set(n.id, n);
  (n.c||[]).forEach(ch => index(ch, depth+1, n));
})(TREE, 0, null);

const world = document.getElementById('world');
const edges = document.getElementById('edges');
const vp = document.getElementById('vp');
const W = {0:320, 1:268, 2:262, 3:250};
const GAPX = 78, GAPY = 14;
let selected = null, query = '';

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

/* create DOM once */
NODES.forEach(n => {
  const b = el('button','node '+(n.depth===0?'root ':'')+n.a);
  b.style.width = (W[Math.min(n.depth,3)]) + 'px';
  b.innerHTML =
    (n.eye ? `<div class="eyebrow">${n.eye}</div>` : '') +
    `<div class="ttl">${n.t}</div>` +
    (n.s ? `<div class="sml">${n.s}</div>` : '') +
    (n.depth>0 && n.a!==INFO ? `<span class="chip ${n.a}">${n.a===YOU?'Someone does it':'Runs itself'}</span>` : '');
  b.addEventListener('click', e => { e.stopPropagation(); select(n.id); });
  n.el = b;
  world.appendChild(b);

  if (n.c && n.c.length){
    const t = el('button','tog', (n.open?'−':'+') + `<span class="cnt">${n.c.length}</span>`);
    t.setAttribute('aria-label','Open or close this branch');
    t.addEventListener('click', e => { e.stopPropagation(); n.open = !n.open; layout(); });
    b.appendChild(t); n.tog = t;
  }
});

function visible(){
  const out=[];
  (function walk(n){ out.push(n); if(n.open) (n.c||[]).forEach(walk); })(TREE);
  return out;
}

function layout(){
  const vis = visible();
  NODES.forEach(n => { n.el.style.display='none'; });
  vis.forEach(n => { n.el.style.display='block'; if(n.tog) n.tog.firstChild.textContent = n.open?'−':'+'; });

  // column x
  const colX = {}; let x = 0;
  for (let d=0; d<=3; d++){ colX[d]=x; x += W[d] + GAPX; }

  let cursor = 0;
  (function place(n){
    n.h = n.el.offsetHeight;
    n.x = colX[Math.min(n.depth,3)];
    if (n.open && n.c && n.c.length){
      n.c.forEach(place);
      const f=n.c[0], l=n.c[n.c.length-1];
      n.y = (f.y + (l.y + l.h))/2 - n.h/2;
    } else {
      n.y = cursor; cursor += n.h + GAPY;
    }
  })(TREE);

  let minY = Infinity, maxY = -Infinity, maxX = 0;
  vis.forEach(n => { minY=Math.min(minY,n.y); maxY=Math.max(maxY,n.y+n.h); maxX=Math.max(maxX,n.x+W[Math.min(n.depth,3)]); });
  vis.forEach(n => { n.y -= minY - 40; n.el.style.transform = `translate(${n.x+40}px, ${n.y}px)`; });

  const H = (maxY-minY) + 120;
  edges.setAttribute('width', maxX+120); edges.setAttribute('height', H+80);
  edges.style.width=(maxX+120)+'px'; edges.style.height=(H+80)+'px';
  let p = '';
  vis.forEach(n => {
    if(!n.parent || !n.parent.open) return;
    const pw = W[Math.min(n.parent.depth,3)];
    const x1 = n.parent.x+40+pw, y1 = n.parent.y + n.parent.h/2;
    const x2 = n.x+40, y2 = n.y + n.h/2;
    const mx = x1 + (x2-x1)*0.5;
    const col = n.a===YOU ? 'var(--sun2)' : n.a===AUTO ? 'var(--auto)' : '#9DAEBF';
    p += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col}" stroke-width="2" opacity=".55"/>`;
    p += `<circle cx="${x2}" cy="${y2}" r="3.5" fill="${col}"/>`;
  });
  edges.innerHTML = p;
  world.style.width = (maxX+140)+'px'; world.style.height=(H+80)+'px';
  applyQuery();
}

/* ---- pan & zoom ---- */
let scale=.82, tx=40, ty=0, dragging=false, sx=0, sy=0;
function apply(){ world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const r = vp.getBoundingClientRect();
  const w = world.offsetWidth, h = world.offsetHeight;
  scale = Math.min((r.width-40)/w, (r.height-40)/h, 1);
  scale = Math.max(scale, .12);
  tx = 20; ty = (r.height - h*scale)/2; apply();
}
vp.addEventListener('pointerdown', e=>{ if(e.target.closest('.node'))return; dragging=true; sx=e.clientX-tx; sy=e.clientY-ty; vp.classList.add('drag'); vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove', e=>{ if(!dragging)return; tx=e.clientX-sx; ty=e.clientY-sy; apply(); });
vp.addEventListener('pointerup', ()=>{dragging=false;vp.classList.remove('drag')});
vp.addEventListener('pointercancel', ()=>{dragging=false;vp.classList.remove('drag')});
vp.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const k = e.deltaY<0 ? 1.12 : 1/1.12;
  const ns = Math.min(1.8, Math.max(.12, scale*k));
  tx = mx - (mx-tx)*(ns/scale); ty = my - (my-ty)*(ns/scale); scale=ns; apply();
},{passive:false});
document.getElementById('zin').onclick=()=>{scale=Math.min(1.8,scale*1.18);apply()};
document.getElementById('zout').onclick=()=>{scale=Math.max(.12,scale/1.18);apply()};
document.getElementById('fit').onclick=fit;
document.getElementById('exp').onclick=()=>{NODES.forEach(n=>n.open=!!(n.c&&n.c.length));layout();fit()};
document.getElementById('col').onclick=()=>{NODES.forEach(n=>n.open=n.depth===0);layout();fit()};

/* ---- search ---- */
const q=document.getElementById('q'), qn=document.getElementById('qn');
q.addEventListener('input', ()=>{ query=q.value.trim().toLowerCase();
  if(query){ NODES.forEach(n=>{ if(matches(n)){ let p=n.parent; while(p){p.open=true;p=p.parent;} } }); }
  layout();
});
function matches(n){
  if(!query) return false;
  const hay = [n.t,n.s,n.eye,n.d&&n.d.plain,(n.d&&n.d.how||[]).join(' '),n.d&&n.d.you,n.d&&n.d.watch].join(' ').toLowerCase();
  return hay.includes(query);
}
function applyQuery(){
  let hits=0;
  visible().forEach(n=>{
    n.el.classList.remove('dim','hit');
    if(query){ if(matches(n)){n.el.classList.add('hit');hits++;} else n.el.classList.add('dim'); }
  });
  qn.textContent = query ? hits+' found' : '';
}

/* ---- detail drawer ---- */
const drawer=document.getElementById('drawer');
document.getElementById('dClose').onclick=()=>{drawer.classList.remove('open'); if(selected){selected.el.classList.remove('sel');selected=null;}};
function select(id){
  const n=NODES.get(id); if(!n) return;
  if(selected) selected.el.classList.remove('sel');
  selected=n; n.el.classList.add('sel');
  document.getElementById('dEye').textContent = n.eye || (n.a===YOU?'Someone does this':n.a===AUTO?'Runs by itself':'Reference');
  document.getElementById('dTitle').textContent = n.t;
  const d=n.d||{};
  let h='';
  if(n.a!==INFO) h+=`<div class="dsec"><span class="chip ${n.a}">${n.a===YOU?'Someone does it':'Runs itself'}</span></div>`;
  if(d.plain) h+=`<div class="dsec"><h3>In plain words</h3><div class="plainbox"><p>${d.plain}</p></div></div>`;
  if(d.how&&d.how.length) h+=`<div class="dsec"><h3>What actually happens</h3><ul>${d.how.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  if(n.msg) h+=`<div class="dsec"><h3>Message the client gets</h3><p>${n.msg}</p></div>`;
  if(d.you) h+=`<div class="dsec"><h3>Your part</h3><p>${d.you}</p></div>`;
  if(d.watch) h+=`<div class="dsec"><h3>Watch out</h3><div class="watch"><p>${d.watch}</p></div></div>`;
  if(n.c&&n.c.length) h+=`<div class="dsec"><h3>Inside this branch</h3><div class="jump">${n.c.map(ch=>`<button data-go="${ch.id}">${ch.t}</button>`).join('')}</div></div>`;
  const body=document.getElementById('dBody'); body.innerHTML=h; body.scrollTop=0;
  body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ n.open=true; layout(); select(b.dataset.go); centerOn(NODES.get(b.dataset.go)); });
  drawer.classList.add('open');
}
function centerOn(n){
  if(!n) return; const r=vp.getBoundingClientRect();
  tx = r.width*0.34 - (n.x+40)*scale; ty = r.height/2 - (n.y+n.h/2)*scale; apply();
}
vp.addEventListener('click', e=>{ if(!e.target.closest('.node')){ /* keep drawer */ } });

/* counts */
let cy=0, ca=0; NODES.forEach(n=>{ if(n.depth>0){ if(n.a===YOU)cy++; if(n.a===AUTO)ca++; }});
document.getElementById('cntYou').textContent=cy;
document.getElementById('cntAuto').textContent=ca;

  <div class="kicker">Training · Walkthrough</div>
  <h1 class="big">One client, start to finish.</h1>
  <p class="lede">Follow a single client down the belt. Orange steps need a person. Green steps happen on their own. Read this once and you can run the desk.</p>
  ${stages.map((s,i)=>`
    <div class="step ${s.a}">
      <div class="num">${i<8?String(i+1).padStart(2,'0'):'—'}</div>
      <div>
        <h3>${s.t}</h3>
        <p class="say">${s.s}</p>
        <div class="cols">
          <div>
            <h4>What actually happens</h4>
            <ul>${(s.d.how||[]).map(x=>`<li>${x}</li>`).join('')}</ul>
          </div>
          <div>
            <h4>${s.a===YOU?'Your part':'Your part (none)'}</h4>
            <ul><li>${s.d.you||'Nothing. The system handles it.'}</li>${s.d.watch?`<li><strong>Watch out:</strong> ${s.d.watch}</li>`:''}</ul>
          </div>
        </div>
        ${s.msg?`<div class="msg"><b>WhatsApp →</b> ${s.msg}</div>`:''}
      </div>
    </div>`).join('')}

  <hr class="hr">
  <h2 class="sec">Then, every period: attendance</h2>
  <p class="secsub">Once a client is being served, the only recurring job is moving attendance across from PagarBook.</p>
  <div class="cards">
    ${NODES.get('att').c.map(a=>`<div class="card ${a.a===AUTO?'dark':''}"><span class="tagx">${a.eye} · ${a.a===YOU?'You':'Automatic'}</span><h4>${a.t}</h4><p>${a.s}</p></div>`).join('')}
  </div>

  <h1 class="big">The desk cheat sheet.</h1>
  <p class="lede">Everything a person needs to remember, on one page.</p>

  <h2 class="sec">The six things you do</h2>
  <p class="secsub">Nothing else in this system is manual work.</p>
  <div class="cards">
    <div class="card"><span class="tagx">Job 1</span><h4>Call the lead</h4><p>Then drag the card to <strong>Contacted</strong>. A welcome WhatsApp goes out by itself.</p></div>
    <div class="card"><span class="tagx">Job 2</span><h4>Qualify them</h4><p>Drag to <strong>Qualified</strong>. The payment link is created and sent automatically.</p></div>
    <div class="card"><span class="tagx">Job 3</span><h4>Set the tier</h4><p>Choose Basic, Essential or Premium on the card. This starts AutoPay for Care clients.</p></div>
    <div class="card"><span class="tagx">Job 4</span><h4>Enter the driver</h4><p>At <strong>Driver Matching</strong>, type the Driver ID and driver details. Save. The rest is automatic.</p></div>
    <div class="card"><span class="tagx">Job 5</span><h4>Start the service</h4><p>Drag the card to <strong>Client</strong> on day one. Reports depend on this.</p></div>
    <div class="card"><span class="tagx">Job 6</span><h4>Upload attendance</h4><p>Export from PagarBook, upload in the portal. The client gets their report.</p></div>
  </div>

  <h2 class="sec">Three rules that protect the system</h2>
  <div class="rule no"><div class="mark">✕</div><p><b>Never type in the backup sheet</b>The sheet fills itself from the CRM. Editing it by hand quietly breaks attendance reports. Fix things on the card instead.</p></div>
  <div class="rule no"><div class="mark">✕</div><p><b>Never make your own payment link</b>Only links created by the system are visible to it. A hand-made link means nothing after it will fire.</p></div>
  <div class="rule yes"><div class="mark">✓</div><p><b>Always use the same Driver ID</b>The ID in PagarBook, on the card and in the sheet must be identical. That one ID connects the driver, the client and every report.</p></div>

  <h2 class="sec">If something looks wrong</h2>
  <p class="secsub">Work down this list before escalating.</p>
  ${NODES.get('fix').c.map(f=>`<div class="rule"><div class="mark">?</div><p><b>${f.t}</b>${f.d.plain}${f.d.you?' <em>'+f.d.you+'</em>':''}</p></div>`).join('')}

  <h2 class="sec">Plans and tiers, side by side</h2>
  <div class="cards">
    <div class="card dark"><span class="tagx">How they pay</span><h4>Care Plan</h4><p>₹9,999 to join, then a monthly AutoPay charge and an automatic receipt each month.</p></div>
    <div class="card dark"><span class="tagx">How they pay</span><h4>Standard Plan</h4><p>₹17,700 once, GST included. No subscription, no monthly steps.</p></div>
    <div class="card"><span class="tagx">How often reports go</span><h4>Basic</h4><p>Attendance report once a month.</p></div>
    <div class="card"><span class="tagx">How often reports go</span><h4>Essential</h4><p>Attendance report once a week.</p></div>
    <div class="card"><span class="tagx">How often reports go</span><h4>Premium</h4><p>Attendance report every day.</p></div>
    <div class="card"><span class="tagx">All tiers</span><h4>Payroll</h4><p>Payroll report goes out monthly, whatever the tier.</p></div>
  </div>

    ${NODES.get('gloss').c.map(g=>`<div class="card"><h4>${g.t}</h4><p>${g.d.plain}</p></div>`).join('')}

/* ============================================================
   5. VIEW SWITCHING
   ============================================================ */
const panes={walk:document.getElementById('paneWalk'), sheet:document.getElementById('paneSheet')};
document.querySelectorAll('.views button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.views button').forEach(x=>x.setAttribute('aria-selected', x===b?'true':'false'));
    const v=b.dataset.view;
    panes.walk.classList.toggle('on', v==='walk');
    panes.sheet.classList.toggle('on', v==='sheet');
    const mapOn = v==='map';
    ['vp','tools','legend'].forEach(id=>document.getElementById(id).style.display = mapOn?'':'none');
    document.querySelector('.grid').style.display = mapOn?'':'none';
    if(!mapOn) drawer.classList.remove('open');
    if(mapOn) fit();
  };
});

/* go */
layout();
requestAnimationFrame(()=>{ NODES.get('start').open=true; layout(); fit(); });
window.addEventListener('resize', ()=>{ layout(); });
</script>
